# Serves the built SPA and proxies API calls to the backend service
# (docker-compose.yml: bms-api on port 8000). One origin for the
# browser, so no CORS configuration is needed anywhere.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + SSE event stream. Buffering off and a long read timeout
    # keep the /api/v1/stream (server-sent events) connection live.
    location /api/ {
        proxy_pass http://bms-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: client-side routes resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
