name: Verify BMS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    # Ruff gate (config in ruff.toml). The repo previously had no linter
    # in CI at all, so unused imports and unsorted imports accumulated
    # invisibly across the backend, the ML pipeline and the tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check .
  root-tests:
    # The offline ML suite at the repo root was not exercised by CI, so
    # dataset-dependent tests could fail (instead of skipping) on a
    # clean clone without anyone noticing. Data-dependent tests skip
    # when the NASA .mat files have not been downloaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bms
          POSTGRES_PASSWORD: bms
          POSTGRES_DB: bms
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bms -d bms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BMS_DATABASE_URL: postgresql+asyncpg://bms:bms@127.0.0.1:5433/bms
      BMS_REQUIRE_DB: "true"
      BMS_MQTT_ENABLED: "false"
      BMS_MONITOR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest -ra
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run typecheck && npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
  compose:
    # Deployment smoke: builds the images and proves the API serves and
    # Grafana boots with its provisioned datasources. This is CI evidence for
    # the compose stack; it is not target-laptop (HTTPS) acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: API answers health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 5
          done
          docker compose logs bms-api
          exit 1
      - name: Grafana serves its login page
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3050/login; then exit 0; fi
            sleep 5
          done
          docker compose logs grafana
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
