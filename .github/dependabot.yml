# Dependency update automation. The repo pins Python/Node/Docker
# dependencies exactly but had no mechanism that *noticed* when a pin
# went stale — which is how the backend shipped a Starlette with known
# vulnerabilities (see docs/AUDIT_2026-10-23.md). Weekly PRs, grouped
# per ecosystem; CI (verify.yml) is the gate for merging them.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
