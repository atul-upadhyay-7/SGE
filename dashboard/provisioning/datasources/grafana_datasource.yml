apiVersion: 1
datasources:
  # Dashboard panels: the JSON API (frontend-only plugin, no alerting).
  - name: Battery PDM
    uid: battery-pdm-ds
    type: simpod-json-datasource
    access: proxy
    url: http://localhost:8099
    isDefault: true
  # Alert rules: Prometheus (backend datasource, full alerting support).
  # Point this at wherever Prometheus runs (docker compose publishes it
  # on 127.0.0.1:9090).
  - name: Battery PDM Prometheus
    uid: battery-pdm-prom
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
