apiVersion: 1

groups:
  - orgId: 1
    name: battery_pdm_alerts
    folder: Battery PDM
    interval: 1m
    rules:
      - uid: alert_soh_below_threshold
        title: Battery SOH Below Retirement Threshold
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: battery-pdm-ds
            model:
              target: live_soh_by_cycle
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [80]
                    type: lt
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Battery cell SOH has dropped below the 80% retirement threshold.
        labels:
          severity: critical

      - uid: alert_input_out_of_range
        title: Inputs Outside Trained Operational Range
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: battery-pdm-ds
            model:
              target: live_temperature_by_cycle
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [55]
                    type: gt
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Cell peak temperature or operating inputs exceed the trained model operational bounds.
        labels:
          severity: warning
