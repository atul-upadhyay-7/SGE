# Battery pack monitor: Mosquitto + SOH services + pack bridge + JSON API + Grafana.
#
#   docker compose up --build                     # core stack, waits for an ESP32
#   docker compose --profile demo up --build      # + replay of NASA cells with injected faults
#
# Grafana: http://localhost:3050  (admin / admin, change it)
#   dashboards: "Battery Pack Live (3S, MQTT)" and "Battery PDM (Grafana)"
# Broker for the ESP32: <this machine>:1883
#
# `dns` is set explicitly below because the default Docker embedded
# resolver forwards to the host's systemd-resolved stub (127.0.0.53),
#      which is unreachable from inside a container; Grafana then cannot
#      fetch its JSON-datasource plugin at first boot.
#
# Dashboard panels read the JSON API (api). Alerts read Prometheus:
# the exporter serves the live per-cell gauges, Prometheus scrapes it,
# and Grafana's built-in Prometheus datasource backs the alert rules,
# because the JSON-datasource plugin cannot run alerts ("alerting":
# false).
#
# STATUS: run with Docker on a host with the daemon up; the core stack
# and the demo profile both start, and Grafana serves the provisioned
# dashboards.

x-app: &app
  build: .
  restart: unless-stopped
  dns:
    - 1.1.1.1
    - 8.8.8.8
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  soh:                       # three per-cell SOH services
    <<: *app
    command: python src/pack/run_pack.py --host mosquitto
    environment:
      PDM_SOH_MODEL: models/soh_xgb_demo.joblib
    depends_on: [mosquitto]

  bridge:                    # pack monitor -> data/live_pack.db + bms/pack/PACK1/state
    <<: *app
    command: python src/pack/bridge.py --host mosquitto
    depends_on: [mosquitto]

  api:                       # JSON datasource for Grafana panels
    <<: *app
    command: python dashboard/grafana_api.py
    environment:
      PDM_API_HOST: 0.0.0.0
    ports: ["127.0.0.1:8099:8099"]

  exporter:                  # Prometheus exporter feeding Grafana's alert engine
    <<: *app
    command: python dashboard/alert_exporter.py
    environment:
      PDM_EXPORTER_HOST: 0.0.0.0
    ports: ["127.0.0.1:9101:9101"]
    depends_on: [bridge]

  prometheus:                # backend datasource Grafana's alert rules query
    image: prom/prometheus:v2.54.1
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [exporter]

  grafana:
    image: grafana/grafana-oss:11.2.0
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports: ["3050:3000"]
    environment:
      GF_INSTALL_PLUGINS: simpod-json-datasource
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [api, prometheus]

  demo-publisher:            # stand-in for the ESP32; faults are SYNTHETIC
    <<: *app
    profiles: ["demo"]
    restart: "no"
    command: >
      python src/pack/publisher.py --host mosquitto --delay 1
      --fault CELL2:resistance_spike:40 --fault CELL3:thermal:60
    depends_on: [soh, bridge]
