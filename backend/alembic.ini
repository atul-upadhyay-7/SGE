# Alembic configuration for the BMS backend.
#
# The database URL is intentionally left blank here and supplied at runtime
# by migrations/env.py from app.core.config, so the migrations and the
# application share one source of truth for the connection string.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
timezone = UTC
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
