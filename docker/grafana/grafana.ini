# Reference Grafana configuration for embedding the BMS live dashboard in the
# React app (PRD §4.2 "authenticated Grafana embedding", §4.7 "no credentials in
# the frontend bundle"). Configuration artifact only — Grafana is optional.
#
# Copy to /etc/grafana/grafana.ini, or set the equivalent GF_* environment
# variables. Nothing here contains a secret: passwords and tokens are supplied
# by the operator through the environment.

[security]
# The React app embeds the dashboard in an <iframe>, which requires this.
allow_embedding = true
# Session cookies must survive the iframe's cross-origin request. SameSite
# "none" requires Secure (HTTPS); set both together in production and leave
# SameSite as "lax" for local HTTP development.
cookie_samesite = none
cookie_secure = true

[auth.anonymous]
# Anonymous access lets the embedded panel render without a Grafana login when
# the deployment is internal. When embedding behind authentication instead,
# set enabled = false and let the app pass a signed viewer via Grafana's auth
# proxy / service-account token — never ship admin credentials or a service
# token inside the frontend bundle.
enabled = false
org_role = Viewer

[analytics]
reporting_enabled = false

[users]
# Do not let viewers create orgs or dashboards on a monitored deployment.
allow_sign_up = false

# The frontend reads only public, non-secret values:
#   VITE_GRAFANA_URL            e.g. http://localhost:3050
#   VITE_GRAFANA_DASHBOARD_UID  bms-live
# and builds the embed URL itself; no Grafana credential is ever bundled.
