# Generated by scripts/make_alert_rules.py — do not edit by hand.
#
# The temperature bound is the maximum peak temperature in the clean
# training dataset (63.0242 C), read from nasa_ml_dataset_clean.csv.
# Every rule is query -> reduce(last) -> threshold(condition).
#
# The query datasource is Prometheus (uid battery-pdm-prom), not the JSON-datasource
# plugin, because that plugin declares "alerting": false and Grafana's
# alerting engine cannot evaluate it. noDataState and execErrState are
# Alerting so a dead datasource is visible, not silently OK.
apiVersion: 1

groups:
  - orgId: 1
    name: battery_pdm_alerts
    folder: Battery PDM
    interval: 1m
    rules:
      - uid: alert_soh_below_threshold
        title: Battery SOH Below Retirement Threshold
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: battery-pdm-prom
            model:
              editorMode: code
              expr: battery_pdm_cell_soh_percent
              instant: false
              range: true
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [80.0]
                    type: lt
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Battery cell SOH has dropped below the 80% retirement threshold.
        labels:
          severity: critical

      - uid: alert_input_out_of_range
        title: Inputs Outside Trained Operational Range
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: battery-pdm-prom
            model:
              editorMode: code
              expr: battery_pdm_cell_peak_temperature_celsius
              instant: false
              range: true
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [63.0242]
                    type: gt
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Cell peak temperature exceeds the 63.0242 C maximum the SOH model trained on.
        labels:
          severity: warning
