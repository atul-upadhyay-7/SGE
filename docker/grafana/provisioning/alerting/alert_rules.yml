# Generated by scripts/make_alert_rules.py — do not edit by hand.
#
# The temperature bound is the maximum peak temperature in the clean
# training dataset (63.0242 C), read from nasa_ml_dataset_clean.csv.
# Every rule is query -> reduce(last) -> threshold(condition).
apiVersion: 1

groups:
  - orgId: 1
    name: battery_pdm_alerts
    folder: Battery PDM
    interval: 1m
    rules:
      - uid: alert_soh_below_threshold
        title: Battery SOH Below Retirement Threshold
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: battery-pdm-ds
            model:
              target: live_soh_by_cycle
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [80.0]
                    type: lt
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Battery cell SOH has dropped below the 80% retirement threshold.
        labels:
          severity: critical

      - uid: alert_input_out_of_range
        title: Inputs Outside Trained Operational Range
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: battery-pdm-ds
            model:
              target: live_temperature_by_cycle
          - refId: B
            queryType: ""
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            queryType: ""
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [63.0242]
                    type: gt
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Cell peak temperature exceeds the 63.0242 C maximum the SOH model trained on.
        labels:
          severity: warning
