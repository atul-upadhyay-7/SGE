# Ruff lint gate for the whole tree (backend, ML pipeline, dashboard,
# scripts, tests). Until now the repo had no linter at all and CI ran
# none, so style/correctness drift was invisible.
#
# The rule set is deliberately the conservative core — pycodestyle
# errors, Pyflakes and import order — which the tree can hold clean.
# Widen it (e.g. "B", "BLE", "SIM") as follow-up work, one family at a
# time, instead of landing a thousand findings at once.
target-version = "py312"
extend-exclude = [
    "frontend/node_modules",
    "frontend/dist",
    "data",
    "models",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
